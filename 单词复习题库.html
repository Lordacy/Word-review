<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词总复习题库</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb; --text:#1f2328; --sub:#6b7280;
  --accent:#2563eb; --accent-soft:#eaf1ff; --ok:#16a34a; --ok-soft:#e8f7ee;
  --bad:#dc2626; --bad-soft:#fdecec; --warn:#d97706; --warn-soft:#fff5e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6}
.wrap{max-width:840px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:21px;margin:0;letter-spacing:.5px}
.sub{color:var(--sub);font-size:13px}
.chip-stat{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px;font-size:13px;color:var(--sub)}
.chip-stat b{color:var(--text)}
nav.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:14px;
  color:var(--sub);cursor:pointer;font-family:inherit}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 12px;color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:13px;color:var(--sub);min-width:52px}
.opt{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;
  cursor:pointer;color:var(--text);font-family:inherit;transition:.15s}
.opt:hover{border-color:var(--accent);color:var(--accent)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.group-list{display:flex;flex-wrap:wrap;gap:8px}
.btn-main{display:block;width:100%;margin-top:16px;background:var(--accent);color:#fff;border:0;border-radius:12px;
  padding:13px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-main:disabled{opacity:.45;cursor:not-allowed}
.btn-line{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:14px;
  cursor:pointer;color:var(--text);font-family:inherit}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}

/* quiz */
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:14px}
.qtype{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;
  padding:1px 8px;font-size:12px;margin-bottom:14px}
.stem{font-size:30px;font-weight:700;letter-spacing:.5px;text-align:center;margin:18px 0 6px;word-break:break-word}
.stem.small{font-size:20px;line-height:1.5;font-weight:600}
.hint{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px}
.options{display:grid;gap:10px}
.option{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff;cursor:pointer;
  font-size:15px;text-align:left;font-family:inherit;color:var(--text);transition:.12s;display:flex;gap:10px}
.option:hover:not(.done){border-color:var(--accent);background:#fafcff}
.option .k{color:var(--sub);font-size:13px;min-width:16px}
.option.right{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--bad);background:var(--bad-soft)}
.option.done{cursor:default}
.answerline{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:17px;
  font-family:inherit;outline:none;text-align:center;letter-spacing:1px}
.answerline:focus{border-color:var(--accent)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14px;display:none;line-height:1.7}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:#146c34}
.fb.bad{background:var(--bad-soft);color:#a51b1b}
.fb .big{font-weight:700;font-size:17px;letter-spacing:.5px}
.after{margin-top:14px;text-align:right}
.speak{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;
  font-size:14px;font-family:inherit}
.hide{display:none!important}

/* result */
.score{font-size:44px;font-weight:800;text-align:center;color:var(--accent);line-height:1.2}
.scorebox{text-align:center;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;text-align:center}
.grid3 div{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.grid3 b{display:block;font-size:18px}
.grid3 span{font-size:12px;color:var(--sub)}
.wrong-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.wrong-item .w{font-weight:700}
.wrong-item .m{color:var(--sub)}

/* flashcard */
.fcard{border:1px solid var(--line);border-radius:16px;padding:34px 20px;text-align:center;background:#fff;
  min-height:190px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.fcard .fw{font-size:34px;font-weight:700}
.fcard .fm{font-size:19px;color:var(--text)}
.fcard .tip{color:var(--sub);font-size:13px;margin-top:10px}

/* word list */
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;
  font-family:inherit;outline:none;margin-bottom:12px}
.gtitle{font-size:13px;color:var(--sub);margin:14px 0 6px;display:flex;justify-content:space-between}
table.wt{width:100%;border-collapse:collapse;font-size:14px}
table.wt td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
table.wt td.w{width:34%;font-weight:600}
td .dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.dot.m{background:var(--ok)}.dot.b{background:var(--bad)}.dot.n{background:#d1d5db}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--ok)}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.stat-row .nm{width:120px;color:var(--sub);font-size:13px}
.stat-row .pb{flex:1}
.stat-row .vv{width:52px;text-align:right;font-size:13px;color:var(--sub)}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>单词总复习题库</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div>
      <span class="chip-stat">已掌握 <b id="s-master">0</b></span>
      <span class="chip-stat">错题 <b id="s-wrong">0</b></span>
      <span class="chip-stat">正确率 <b id="s-acc">--</b></span>
    </div>
  </header>

  <nav class="tabs">
    <button class="on" data-tab="home">练习</button>
    <button data-tab="flash">闪卡</button>
    <button data-tab="list">词表</button>
    <button data-tab="stat">统计</button>
  </nav>

  <!-- 首页：设置 -->
  <section id="tab-home">
    <div class="panel">
      <h2>选择范围</h2>
      <div class="row" style="margin-bottom:10px">
        <span class="lab">模式</span>
        <button class="opt on" data-scope="all">全部单词</button>
        <button class="opt" data-scope="group">指定分组</button>
        <button class="opt" data-scope="wrong">只看错词</button>
        <button class="opt" data-scope="new">只看未掌握</button>
      </div>
      <div class="group-list hide" id="groupBox"></div>
      <div class="sub" id="scopeInfo" style="margin-top:10px"></div>
    </div>

    <div class="panel">
      <h2>题型</h2>
      <div class="row">
        <button class="opt on" data-type="mix">混合</button>
        <button class="opt" data-type="en2cn">英 → 中</button>
        <button class="opt" data-type="cn2en">中 → 英</button>
        <button class="opt" data-type="spell">拼写填空</button>
        <button class="opt" data-type="listen">听音拼写</button>
      </div>
    </div>

    <div class="panel">
      <h2>题量</h2>
      <div class="row">
        <button class="opt" data-n="10">10 题</button>
        <button class="opt on" data-n="20">20 题</button>
        <button class="opt" data-n="50">50 题</button>
        <button class="opt" data-n="999">全部</button>
      </div>
    </div>
    <button class="btn-main" id="startBtn">开始练习</button>
  </section>

  <!-- 答题 -->
  <section id="tab-quiz" class="hide">
    <div class="panel">
      <div class="bar"><i id="qbar"></i></div>
      <div class="meta"><span id="qnum"></span><span id="qscore"></span></div>
      <div><span class="qtype" id="qtype"></span></div>
      <div class="stem" id="stem"></div>
      <div class="hint" id="hint"></div>
      <div id="area"></div>
      <div class="fb" id="fb"></div>
      <div class="after hide" id="after"><button class="btn-line" id="nextBtn">下一题 →</button></div>
    </div>
    <div style="text-align:center"><button class="btn-line" id="quitBtn">结束练习</button></div>
  </section>

  <!-- 结果 -->
  <section id="tab-result" class="hide">
    <div class="panel">
      <div class="scorebox">
        <div class="score" id="rscore">0</div>
        <div class="sub">本次得分（每题 100 分）</div>
      </div>
      <div class="grid3">
        <div><b id="rtotal">0</b><span>题数</span></div>
        <div><b id="rright">0</b><span>答对</span></div>
        <div><b id="racc">0%</b><span>正确率</span></div>
      </div>
      <div id="rwrong"></div>
      <div class="row" style="margin-top:18px;justify-content:center">
        <button class="btn-line" id="ragain">再来一组</button>
        <button class="btn-line" id="ronlywrong">只练本次错词</button>
        <button class="btn-line" id="rhome">返回</button>
      </div>
    </div>
  </section>

  <!-- 闪卡 -->
  <section id="tab-flash" class="hide">
    <div class="panel">
      <div class="row" style="margin-bottom:12px">
        <span class="lab">范围</span>
        <div class="group-list" id="flashGroups"></div>
      </div>
      <div class="fcard" id="fcard"><div class="fw" id="fw"></div><div class="tip">点击翻面</div></div>
      <div class="row" style="margin-top:14px;justify-content:center">
        <button class="btn-line" id="fprev">← 上一个</button>
        <button class="speak" id="fspeak">🔊 朗读</button>
        <button class="btn-line" id="fknow">✓ 认识</button>
        <button class="btn-line" id="funknow">✗ 不认识</button>
        <button class="btn-line" id="fnext">下一个 →</button>
      </div>
      <div class="sub" id="finfo" style="text-align:center;margin-top:10px"></div>
    </div>
  </section>

  <!-- 词表 -->
  <section id="tab-list" class="hide">
    <div class="panel">
      <input class="search" id="search" placeholder="搜索单词或中文释义…">
      <div id="listBox"></div>
    </div>
  </section>

  <!-- 统计 -->
  <section id="tab-stat" class="hide">
    <div class="panel">
      <h2>各组掌握进度</h2>
      <div id="statBox"></div>
    </div>
    <div class="panel">
      <h2>错误次数排行</h2>
      <div id="topWrong"></div>
    </div>
    <div class="panel">
      <h2>数据</h2>
      <div class="row">
        <button class="btn-line" id="resetBtn">清空学习记录</button>
        <button class="btn-line" id="exportBtn">导出错词表</button>
      </div>
    </div>
  </section>

  <div class="foot">共 <b id="totalN">0</b> 个单词 · 记录保存在本机浏览器</div>
</div>

const KEY = 'wordbank_v1';
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {stat:{}} }catch(e){ return {stat:{}} } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
function st(id){ return S.stat[id] || (S.stat[id] = {c:0,w:0}) }
const GROUPS = [...new Set(WORDS.map(w=>w.g))];
const norm = s => s.toLowerCase().replace(/[\s\-\.\/,]/g,'');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const pick = (arr,n) => shuffle(arr).slice(0,n);
const TYPES = {en2cn:'英 → 中', cn2en:'中 → 英', spell:'拼写填空', listen:'听音拼写'};

/* ---------- 状态统计 ---------- */
function isMastered(id){ const s=st(id); return s.c>=2 && s.w===0 }
function isWrongWord(id){ return st(id).w > 0 }
function refreshTop(){
  const m = WORDS.filter(w=>isMastered(w.id)).length;
  const wr = WORDS.filter(w=>isWrongWord(w.id)).length;
  let c=0,t=0; WORDS.forEach(w=>{c+=st(w.id).c;t+=st(w.id).c+st(w.id).w});
  document.getElementById('s-master').textContent = m;
  document.getElementById('s-wrong').textContent = wr;
  document.getElementById('s-acc').textContent = t? Math.round(c/t*100)+'%':'--';
  document.getElementById('totalN').textContent = WORDS.length;
  document.getElementById('subtitle').textContent = GROUPS.length + ' 个分组 · 覆盖教材 Lesson 7 / 12 / 17';
}
function speak(t){
  try{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

function pool(){
  if(cfg.scope==='wrong') return WORDS.filter(w=>isWrongWord(w.id));
  if(cfg.scope==='new') return WORDS.filter(w=>!isMastered(w.id));
  if(cfg.scope==='group') return WORDS.filter(w=>cfg.groups.has(w.g));
  return WORDS.slice();
}
function updateScopeInfo(){
  const n=pool().length;
  const el=document.getElementById('scopeInfo');
  el.textContent = '本次可选单词：'+n+' 个' + (n?'':'（换个范围试试）');

/* ---------- 出题 ---------- */
function distractWords(ans){
  const others = WORDS.filter(w=>w.id!==ans.id);
  const sameLen = others.filter(w=>Math.abs(w.w.length-ans.w.length)<=2);
  const from = sameLen.length>=3 ? sameLen : others;
  return pick(from,3).map(w=>w.w);
}
function distractMeanings(ans){
  const others = WORDS.filter(w=>w.id!==ans.id);
  const chars = [...new Set(ans.m.replace(/[（）()\s，,；;、]/g,''))];
  const scored = others.map(w=>{
    const mc=[...w.m.replace(/[（）()\s，,；;、]/g,'')];
    const share = mc.filter(c=>chars.includes(c)).length;
    return {w, share};
  });
  scored.sort((a,b)=>b.share-a.share);
  const topPool = scored.slice(0, Math.max(8, Math.min(24, scored.length)));
  return pick(topPool,3).map(o=>o.w.m);
}
function makeQ(word, type){
  if(type==='mix'){
    const bag=['en2cn','cn2en','spell'];
    if(cfg.type==='mix') type = bag[Math.random()*bag.length|0];
  }
  const q = {word, type, done:false};
  if(type==='en2cn'){
    q.stem = word.w; q.hint='选出正确的中文释义';
    q.options = shuffle([word.m, ...distractMeanings(word)]);
  } else if(type==='cn2en'){
    q.stem = word.m; q.stemSmall=true; q.hint='选出对应的英文单词';
    q.options = shuffle([word.w, ...distractWords(word)]);
  } else if(type==='spell'){
    q.stem = word.m; q.stemSmall=true;
    q.hint = '首字母 '+word.w[0]+' · 共 '+word.w.replace(/[^a-zA-Z]/g,'').length+' 个字母';
  } else if(type==='listen'){
    q.stem = '🔊 点击播放'; q.stemSmall=true;
    q.hint = '听发音，拼出单词（可反复播放）';
  }
  q.answer = (type==='en2cn') ? word.m : word.w;
  return q;
}

/* ---------- 答题流程 ---------- */
let Q = {list:[], i:0, right:0, wrongs:[], t0:0};
document.getElementById('startBtn').onclick = () => {
  const p = pool(); if(!p.length) return;
  let n = Math.min(cfg.n, p.length);
  const list = pick(p, n).map(w=>makeQ(w, cfg.type));
  Q = {list, i:0, right:0, wrongs:[], t0:Date.now()};
  show('quiz'); renderQ();
};
document.getElementById('quitBtn').onclick = () => finish();

function renderQ(){
  const q = Q.list[Q.i]; if(!q) return finish();
  document.getElementById('qbar').style.width = (Q.i/Q.list.length*100)+'%';
  document.getElementById('qnum').textContent = '第 '+(Q.i+1)+' / '+Q.list.length+' 题';
  document.getElementById('qscore').textContent = '✓ '+Q.right+'   ✗ '+Q.wrongs.length;
  document.getElementById('qtype').textContent = TYPES[q.type];
  const st_ = document.getElementById('stem');
  st_.textContent = q.stem; st_.className = 'stem'+(q.stemSmall?' small':'');
  document.getElementById('hint').textContent = q.hint||'';
  const fb=document.getElementById('fb'); fb.className='fb'; fb.innerHTML='';
  document.getElementById('after').classList.add('hide');
  const area=document.getElementById('area'); area.innerHTML='';

  if(q.type==='en2cn' || q.type==='cn2en'){
    const box=document.createElement('div'); box.className='options';
    q.options.forEach((o,idx)=>{
      const b=document.createElement('button'); b.className='option';
      b.innerHTML='<span class="k">'+(idx+1)+'</span><span>'+o+'</span>';
      b.onclick=()=>answer(q,o,b);
      box.appendChild(b);
    });
    area.appendChild(box);
  } else {
    if(q.type==='listen'){
      const b=document.createElement('button'); b.className='speak'; b.textContent='🔊 再听一次';
      b.style.margin='0 auto 10px'; b.style.display='block';
      b.onclick=()=>speak(q.word.w); area.appendChild(b);
      setTimeout(()=>speak(q.word.w),150);
    }
    const inp=document.createElement('input'); inp.className='answerline'; inp.placeholder='输入单词后回车';
    inp.autocomplete='off'; inp.spellcheck=false;
    const btn=document.createElement('button'); btn.className='btn-main'; btn.textContent='提交';
    const go=()=>{ if(q.done) return; answer(q, inp.value.trim(), inp) };
    btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go() };
    area.appendChild(inp); area.appendChild(btn);
    setTimeout(()=>inp.focus(),50);
  }
}
function answer(q, val, el){
  if(q.done) return; q.done=true;
  const ok = (q.type==='en2cn') ? (val===q.answer) : (norm(val)===norm(q.answer));
  const s = st(q.word.id);
  ok ? s.c++ : s.w++; save();
  if(ok) Q.right++; else Q.wrongs.push(q.word);
  const fb=document.getElementById('fb');
  fb.className='fb show '+(ok?'ok':'bad');
  fb.innerHTML = (ok?'✓ 正确！　':'✗ 正确答案：') +
    '<span class="big">'+q.word.w+'</span> —— '+q.word.m +
    (ok?'':'<br><span style="font-size:13px">你答的是：'+(val||'(空)')+'</span>');
  if(q.type==='en2cn'||q.type==='cn2en'){
    document.querySelectorAll('#area .option').forEach(b=>{
      b.classList.add('done');
      const t=b.querySelectorAll('span')[1].textContent;
      if(t===q.answer) b.classList.add('right');
      else if(!ok && t===val) b.classList.add('wrong');
    });
  } else { if(el) el.disabled=true; if(!ok){ const t=document.createElement('div'); } }
  document.getElementById('after').classList.remove('hide');
  refreshTop();
}
document.getElementById('nextBtn').onclick = ()=>{ Q.i++; renderQ() };

  const n=parseInt(e.key,10);

    if(opts[n-1]) opts[n-1].click();
  }
});

function finish(){
  const total=Q.list.length, right=Q.right;
  document.getElementById('rscore').textContent = Math.round(right/total*100);
  document.getElementById('rtotal').textContent = total;
  document.getElementById('rright').textContent = right;
  document.getElementById('racc').textContent = Math.round(right/total*100)+'%';
  const box=document.getElementById('rwrong'); box.innerHTML='';
  if(Q.wrongs.length){
    const h=document.createElement('div'); h.style.marginTop='18px'; h.style.fontWeight='600';
    h.textContent='错题回顾（'+Q.wrongs.length+'）'; box.appendChild(h);
    Q.wrongs.forEach(w=>{
      const d=document.createElement('div'); d.className='wrong-item';
      d.innerHTML='<span class="w">'+w.w+'</span> —— <span class="m">'+w.m+'</span>　<span style="font-size:12px;color:#9ca3af">'+w.g+'</span>';
      box.appendChild(d);
    });
  } else {
    box.innerHTML='<div style="text-align:center;margin-top:16px;color:#16a34a">全对，这组稳了 🎉</div>';
  }
  show('result');
}
document.getElementById('ragain').onclick = ()=>document.getElementById('startBtn').click();
document.getElementById('rhome').onclick = ()=>show('home');
document.getElementById('ronlywrong').onclick = ()=>{
  if(!Q.wrongs.length) return;
  Q = {list: shuffle(Q.wrongs).map(w=>makeQ(w,cfg.type)), i:0, right:0, wrongs:[], t0:Date.now()};
  show('quiz'); renderQ();
};

/* ---------- 闪卡 ---------- */
const flash = {list:[], i:0, side:0, state:{init:false}};
function initFlash(){
  const box=document.getElementById('flashGroups'); box.innerHTML='';
  GROUPS.forEach(g=>{
    const b=document.createElement('button'); b.className='opt on'; b.textContent=g;
    b.onclick=()=>{ b.classList.toggle('on'); flash.state[g]=!flash.state[g]; reloadFlash() };
    flash.state[g]=true; box.appendChild(b);
  });
  reloadFlash(); flash.state.init=true;
}
function reloadFlash(){
  const sel = GROUPS.filter(g=>flash.state[g]);
  flash.list = shuffle(WORDS.filter(w=>sel.includes(w.g)));
  flash.i=0; flash.side=0; drawFlash();
}
function drawFlash(){
  const w=flash.list[flash.i]; if(!w){ document.getElementById('fw').textContent='（无单词）'; return }
  const c=document.getElementById('fcard');
  document.getElementById('fw').className = flash.side? 'fm':'fw';
  document.getElementById('fw').textContent = flash.side? w.m : w.w;
  const tip = c.querySelector('.tip');
  tip.textContent = (flash.side?'（点击回到单词）':'点击翻面看释义')+'　·　'+w.g;
  document.getElementById('finfo').textContent = (flash.i+1)+' / '+flash.list.length+
    '　✓'+st(w.id).c+' ✗'+st(w.id).w;
}
document.getElementById('fcard').onclick = ()=>{ flash.side=!flash.side; drawFlash() };
document.getElementById('fprev').onclick = ()=>{ flash.i=(flash.i-1+flash.list.length)%flash.list.length; flash.side=0; drawFlash() };
document.getElementById('fnext').onclick = ()=>{ flash.i=(flash.i+1)%flash.list.length; flash.side=0; drawFlash() };
document.getElementById('fspeak').onclick = ()=>{ const w=flash.list[flash.i]; if(w) speak(w.w) };
document.getElementById('fknow').onclick = ()=>{ const w=flash.list[flash.i]; if(w){st(w.id).c++;save();refreshTop()} flash.i=(flash.i+1)%flash.list.length; flash.side=0; drawFlash() };
document.getElementById('funknow').onclick = ()=>{ const w=flash.list[flash.i]; if(w){st(w.id).w++;save();refreshTop()} flash.side=1; drawFlash() };

/* ---------- 词表 ---------- */
function renderList(){
  const kw = (document.getElementById('search').value||'').trim().toLowerCase();
  const box=document.getElementById('listBox'); box.innerHTML='';
  GROUPS.forEach(g=>{
    const ws = WORDS.filter(w=>w.g===g && (!kw || w.w.toLowerCase().includes(kw) || w.m.includes(kw)));
    if(!ws.length) return;
    const t=document.createElement('div'); t.className='gtitle';
    const done=ws.filter(w=>isMastered(w.id)).length;
    t.innerHTML='<span>'+g+'</span><span>'+done+' / '+ws.length+' 已掌握</span>';
    box.appendChild(t);
    const tb=document.createElement('table'); tb.className='wt';
    ws.forEach(w=>{
      const s=st(w.id);
      const cls = s.w>0? 'b' : (isMastered(w.id)?'m':'n');
      const tr=document.createElement('tr');
      tr.innerHTML='<td class="w"><span class="dot '+cls+'"></span>'+w.w+'</td><td>'+w.m+'</td>';
      tr.style.cursor='pointer'; tr.onclick=()=>speak(w.w);
      tb.appendChild(tr);
    });
    box.appendChild(tb);
  });
  if(!box.innerHTML) box.innerHTML='<div class="sub">没有匹配的单词</div>';
}
document.getElementById('search').oninput = renderList;

/* ---------- 统计 ---------- */
function renderStat(){
  const box=document.getElementById('statBox'); box.innerHTML='';
  GROUPS.forEach(g=>{
    const ws=WORDS.filter(w=>w.g===g);
    const m=ws.filter(w=>isMastered(w.id)).length;
    const pct=Math.round(m/ws.length*100);
    const d=document.createElement('div'); d.className='stat-row';
    d.innerHTML='<span class="nm">'+g+'</span><span class="pb"><span class="pbar"><i style="width:'+pct+'%"></i></span></span><span class="vv">'+m+'/'+ws.length+'</span>';
    box.appendChild(d);
  });
  const tw=document.getElementById('topWrong'); tw.innerHTML='';
  const bad=WORDS.filter(w=>st(w.id).w>0).sort((a,b)=>st(b.id).w-st(a.id).w).slice(0,15);
  if(!bad.length) tw.innerHTML='<div class="sub">还没有错题记录，去做两组练习吧。</div>';
  bad.forEach(w=>{
    const d=document.createElement('div'); d.className='wrong-item';
    d.innerHTML='<span class="w">'+w.w+'</span> —— <span class="m">'+w.m+'</span>　<span style="font-size:12px;color:#dc2626">错 '+st(w.id).w+' 次</span>';
    tw.appendChild(d);
  });
}
document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('确定清空所有学习记录？此操作不可撤销。')){ S={stat:{}}; save(); refreshTop(); renderStat(); }
};
document.getElementById('exportBtn').onclick = ()=>{
  const bad=WORDS.filter(w=>st(w.id).w>0);
  const txt=bad.map(w=>w.w+' —— '+w.m+'（错 '+st(w.id).w+' 次）').join('\n') || '（暂无错题）';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
  a.download='错词表.txt'; a.click();
};

refreshTop();
</script>
